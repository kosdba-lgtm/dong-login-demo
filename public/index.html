<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aton뱅크</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="phone">
      <main class="container">
        <div class="brand" aria-hidden="true">
          <span class="brand-mark">DONG</span>
          <span class="brand-name">뱅크</span>
        </div>

        <div class="greeting">
          <h1>안녕하세요.<br />반갑습니다.</h1>
          <p>아이디와 비밀번호를 입력해주세요.</p>
        </div>

        <form id="authForm">
          <label>
            이름
            <input id="nameInput" type="text" name="name" placeholder="홍길동" />
          </label>
          <label>
            아이디
            <input id="emailInput" type="text" name="email" placeholder="아이디를 입력하세요" />
          </label>
          <label>
            비밀번호
            <input id="passwordInput" type="password" name="password" placeholder="비밀번호를 입력하세요" required />
          </label>
        </form>

        <div id="message" class="message"></div>

        <div class="bottom-actions">
          <button id="loginButton" class="action-button active">로그인</button>
          <button id="signupButton" class="action-button">회원가입</button>
        </div>
      </main>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
